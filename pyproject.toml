[project]
name = "tuical"
version = "0.1.0"
description = "Local-only terminal calendar (TUI)"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
authors = [{ name = "Kongvut Sangkla" }]

[project.scripts]
tuical = "tuical.app:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B"]
